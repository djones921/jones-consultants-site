name: Notify search engines (IndexNow)

# IndexNow is supported by Bing, Yandex, Seznam, Naver and (via Bing) DuckDuckGo. Google does not
# participate; it discovers changes through the sitemap in Search Console. Zero cost, no account needed:
# the key is the file /<key>.txt served from the site root (generated by tools/build.py).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare Pages to deploy
        run: sleep 120

      - name: Submit changed URLs to IndexNow
        run: |
          KEY=$(python3 -c "import sys; sys.path.insert(0,'tools'); import siteconfig; print(siteconfig.INDEXNOW_KEY)")
          HOST=jcseng.com
          # Confirm the key file is live before submitting; otherwise the submission is rejected.
          curl -sf "https://$HOST/$KEY.txt" > /dev/null || { echo "::warning::Key file not yet reachable; skipping."; exit 0; }
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's|</\?loc>||g' | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          BODY=$(python3 -c "import json,sys; print(json.dumps({'host':'$HOST','key':'$KEY','keyLocation':'https://$HOST/$KEY.txt','urlList':json.loads(sys.argv[1])}))" "$URLS")
          code=$(curl -s -o /tmp/resp.txt -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' -H 'Content-Type: application/json; charset=utf-8' --data "$BODY")
          echo "IndexNow response: $code"; cat /tmp/resp.txt || true
          case "$code" in 200|202) ;; *) echo "::warning::IndexNow returned $code";; esac
